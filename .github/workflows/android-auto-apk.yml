# Builds the debug APK for the Android Auto app (android-auto/)
#
# Trigger: a push that changes android-auto/, or a manual run from the Actions tab (workflow_dispatch)
# Output: on the run page under Artifacts, "moto-android-auto-debug-apk"
# GitHub-hosted ubuntu runners come with the Android SDK preinstalled
name: android-auto-apk

on:
  push:
    paths:
      - "android-auto/**"
      - ".github/workflows/android-auto-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-auto-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The project has no Gradle Wrapper yet, so pin the Gradle version here
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Core unit tests
        run: gradle -p android-auto/core test --console=plain

      - name: Build debug APK
        run: gradle -p android-auto :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: moto-android-auto-debug-apk
          path: android-auto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
